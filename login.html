 <!DOCTYPE html>

<html lang="en">

<head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Real Estate - Login</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
    }

    .navbar {
        background-color: #1f3c88;
        color: white;
        padding: 18px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .logo {
        font-size: 24px;
        font-weight: bold;
    }

    .navbar a {
        color: white;
        text-decoration: none;
        margin-left: 20px;
    }

    .login-box {
        width: 400px;
        margin: 70px auto;
        background-color: white;
        padding: 35px;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .login-box h2 {
        text-align: center;
        color: #1f3c88;
        margin-bottom: 30px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 12px;
        margin-bottom: 20px;
        border: 1px solid #ccc;
        border-radius: 5px;
        box-sizing: border-box;
    }

    button {
        width: 100%;
        padding: 12px;
        background-color: #1f3c88;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background-color: #162d68;
    }

    .register-link {
        text-align: center;
        margin-top: 20px;
    }

    .register-link a {
        color: #1f3c88;
        font-weight: bold;
        text-decoration: none;
    }

    #message {
        text-align: center;
        margin-top: 15px;
        font-weight: bold;
    }

    footer {
        background-color: #1f3c88;
        color: white;
        text-align: center;
        padding: 15px;
        margin-top: 100px;
    }
</style>

</head>

<body>

<!-- Navigation Bar -->

<div class="navbar">

    <div class="logo">
        Dream Home Real Estate
    </div>

    <div>
        <a href="home.html">HOME</a>
        <a href="signup.html">SIGN UP</a>
        <a href="login.html">LOGIN</a>
    </div>

</div>


<!-- Login Form -->

<div class="login-box">

    <h2>User Login</h2>

    <form id="loginForm">

        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >


        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
        >


        <button type="submit">
            Login
        </button>

    </form>


    <div id="message"></div>


    <div class="register-link">
        Don't have an account?
        <a href="signup.html">Sign up  here</a>
    </div>

</div>


<!-- Footer -->

<footer>
    © 2026 Dream Home Real Estate. All Rights Reserved.
</footer>


<!-- Login JavaScript -->

<script>

    document.getElementById("loginForm").addEventListener("submit", function(event) {

        event.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        const message = document.getElementById("message");

        fetch("/login", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                email: email,
                password: password
            })

        })

        .then(response => response.json())

        .then(data => {

            if (data.message === "Login successful") {

                message.style.color = "green";
                message.textContent = "Login successful!";

                setTimeout(function() {

                    window.location.href = "home.html";

                }, 1000);

            } else {

                message.style.color = "red";
                message.textContent = data.message || "Invalid email or password.";

            }

        })

        .catch(error => {

            console.error(error);

            message.style.color = "red";
            message.textContent = "Login failed. Please try again.";

        });

    });

</script>

</body>

</html>
